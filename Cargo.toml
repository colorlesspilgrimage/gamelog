[package]
name = "gamelog"
version = "0.1.0"
edition = "2024"
description = "A terminal UI for logging and tracking video games"
license = "MIT"
repository = "https://github.com/colorlesspilgrimage/gamelog"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = { version = "0.29.0", features = ["serde"] }
csv = "1.4.0"
directories = "6.0.0"
image = "0.25.10"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
ureq = { version = "3.4.2", features = ["json"] }
urlencoding = "2.1.3"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

# `cargo deb` (cargo-deb) and `cargo generate-rpm` (cargo-generate-rpm) read
# these; see packaging/build-linux-packages.sh. `target/release` paths are
# rewritten to `target/<triple>/release` when a --target is given.
[package.metadata.deb]
maintainer = "Sam Hood <samjdhood@gmail.com>"
section = "games"
depends = "$auto"
extended-description = """\
Track title, system, status, hours played, a 5-star rating, cover art, and \
notes for every game from a keyboard-driven split-pane terminal UI. Data is \
stored as plain JSON under ~/.gamelog."""
assets = [
    ["target/release/gamelog", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/gamelog/README.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/gamelog", dest = "/usr/bin/gamelog", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/licenses/gamelog/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/gamelog/README.md", mode = "644", doc = true },
]
