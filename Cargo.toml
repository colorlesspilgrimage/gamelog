[package]
name = "gamelog"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = { version = "0.29.0", features = ["serde"] }
directories = "6.0.0"
image = "0.25.10"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
ureq = { version = "3.4.2", features = ["json"] }
urlencoding = "2.1.3"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
